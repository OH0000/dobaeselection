<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도배선수권 — 관리자</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white:      #ffffff;
      --bg:         #f5f4f1;
      --border:     #e0dedd;
      --text-dark:  #1a1a1a;
      --text-mid:   #555452;
      --text-light: #999896;
      --serif:      'Nanum Myeongjo', serif;
      --sans:       'Nanum Gothic', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: var(--sans);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* 로그인 */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px 44px;
      width: 360px;
      text-align: center;
    }

    .login-box h1 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .login-box p {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 32px;
    }

    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.2em;
      background: var(--bg);
    }

    .login-box input:focus { border-color: var(--text-dark); background: var(--white); }

    .login-box button {
      width: 100%;
      padding: 13px;
      background: var(--text-dark);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-box button:hover { background: #3a3a3a; }
    .login-error { color: #c00; font-size: 12px; margin-top: 10px; }

    /* 관리자 메인 */
    #admin-screen { display: none; }

    .admin-header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .admin-header h1 {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 800;
    }

    .admin-header span {
      font-size: 12px;
      color: var(--text-light);
    }

    .header-right { display: flex; align-items: center; gap: 16px; }

    .btn-logout {
      padding: 8px 16px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      color: var(--text-mid);
    }

    .btn-logout:hover { border-color: var(--text-dark); color: var(--text-dark); }

    /* 탭 */
    .tab-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      gap: 0;
    }

    .tab {
      padding: 14px 20px;
      font-size: 13px;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab.active { color: var(--text-dark); border-bottom-color: var(--text-dark); font-weight: 700; }
    .tab:hover { color: var(--text-dark); }

    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--text-dark);
      color: #fff;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      margin-left: 6px;
    }

    /* 카드 그리드 */
    .card-grid {
      padding: 32px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .report-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }

    .report-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

    .card-photo {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-size: 12px;
    }

    .card-photo img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-body { padding: 16px 18px; }

    .card-address {
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 11px;
      color: var(--text-light);
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
    }

    .card-comment {
      font-size: 13px;
      color: var(--text-mid);
      line-height: 1.6;
      margin-bottom: 14px;
      min-height: 20px;
    }

    .card-actions { display: flex; gap: 8px; }

    .btn-approve {
      flex: 1;
      padding: 10px;
      background: var(--text-dark);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-approve:hover { background: #3a3a3a; }

    .btn-reject {
      flex: 1;
      padding: 10px;
      background: var(--white);
      color: var(--text-mid);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reject:hover { border-color: #c00; color: #c00; }

    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .badge-waiting  { background: #fff3cd; color: #856404; }
    .badge-approved { background: #d4edda; color: #155724; }
    .badge-rejected { background: #f8d7da; color: #721c24; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 0;
      color: var(--text-light);
      font-size: 14px;
    }

    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 0;
      color: var(--text-light);
      font-size: 13px;
    }
  </style>
</head>
<body>

<!-- 로그인 -->
<div id="login-screen">
  <div class="login-box">
    <h1>도배선수권</h1>
    <p>관리자 페이지</p>
    <input type="password" id="pw-input" placeholder="비밀번호" onkeydown="if(event.key==='Enter') login()" />
    <button onclick="login()">로그인</button>
    <p class="login-error" id="login-error"></p>
  </div>
</div>

<!-- 관리자 메인 -->
<div id="admin-screen">
  <div class="admin-header">
    <h1>도배선수권 관리자</h1>
    <div class="header-right">
      <span id="total-count"></span>
      <button class="btn-logout" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="showTab('waiting')" id="tab-waiting">
      대기 중 <span class="tab-badge" id="badge-waiting">0</span>
    </div>
    <div class="tab" onclick="showTab('approved')" id="tab-approved">
      승인됨 <span class="tab-badge" id="badge-approved">0</span>
    </div>
    <div class="tab" onclick="showTab('all')" id="tab-all">
      전체
    </div>
  </div>

  <div class="card-grid" id="card-grid">
    <div class="loading-state">불러오는 중...</div>
  </div>
</div>

<script>
  // ════════════════════════════════
  //  설정값
  // ════════════════════════════════
  const ADMIN_PASSWORD  = '8735';  // ← 비밀번호 여기서 변경
  const SHEET_ID        = '1vWiY6eQGZWhUIoIozAr7HtBRlAse8nqZrIbBWkfEwv0';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxL_xw0c6TcyzEdZXGDAe24YZVpLr8vYUyt8vOflYys-NIEu3X7WB_HYwnIOZiXdnxO/exec';

  let allReports  = [];
  let currentTab  = 'waiting';

  // ── 로그인 ──────────────────────
  function login() {
    const pw = document.getElementById('pw-input').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      loadReports();
    } else {
      document.getElementById('login-error').textContent = '비밀번호가 틀렸습니다.';
    }
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('pw-input').value = '';
  }

  // ── 데이터 로드 ─────────────────
  async function loadReports() {
    document.getElementById('card-grid').innerHTML = '<div class="loading-state">불러오는 중...</div>';

    try {
      const url  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet1`;
      const res  = await fetch(url);
      const text = await res.text();
      const jsonStr = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)?.[1]
                   || text.substring(47).slice(0, -2);
      const json = JSON.parse(jsonStr);
      const rows = json.table.rows;

      allReports = rows.map((row, i) => ({
        rowNum:   i + 2, // 시트 실제 행번호 (1행 헤더)
        id:       row.c[0]?.v || i + 1,
        date:     row.c[1]?.v || '',
        address:  row.c[2]?.v || '',
        type:     row.c[3]?.v || '',
        count:    row.c[4]?.v || 1,
        comment:  row.c[5]?.v || '',
        lat:      row.c[6]?.v || 0,
        lng:      row.c[7]?.v || 0,
        photo:    row.c[8]?.v || '',
        approved: row.c[9]?.v || '대기'
      }));

      updateBadges();
      renderCards();

    } catch(e) {
      document.getElementById('card-grid').innerHTML = '<div class="loading-state">데이터를 불러오지 못했습니다.</div>';
    }
  }

  // ── 배지 업데이트 ───────────────
  function updateBadges() {
    const waiting  = allReports.filter(r => r.approved === '대기' || r.approved === '').length;
    const approved = allReports.filter(r => r.approved === '승인').length;
    document.getElementById('badge-waiting').textContent  = waiting;
    document.getElementById('badge-approved').textContent = approved;
    document.getElementById('total-count').textContent    = `총 ${allReports.length}건`;
  }

  // ── 탭 전환 ─────────────────────
  function showTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${tab}`)?.classList.add('active');
    renderCards();
  }

  // ── 카드 렌더링 ─────────────────
  function renderCards() {
    let filtered = allReports;
    if (currentTab === 'waiting')  filtered = allReports.filter(r => r.approved === '대기' || r.approved === '');
    if (currentTab === 'approved') filtered = allReports.filter(r => r.approved === '승인');

    if (filtered.length === 0) {
      document.getElementById('card-grid').innerHTML = '<div class="empty-state">제보가 없습니다.</div>';
      return;
    }

    document.getElementById('card-grid').innerHTML = filtered.map(r => `
      <div class="report-card" id="card-${r.rowNum}">
        <div class="card-photo">
          ${r.photo && r.photo.startsWith('data:')
            ? `<img src="${r.photo}" alt="제보 사진" />`
            : '<span>사진 없음</span>'}
        </div>
        <div class="card-body">
          <div class="card-address">${r.address || '주소 없음'}</div>
          <div class="card-meta">
            <span>${r.date}</span>
            <span>${r.type} · ${r.count}개</span>
            <span class="status-badge ${r.approved === '승인' ? 'badge-approved' : r.approved === '거절' ? 'badge-rejected' : 'badge-waiting'}">${r.approved || '대기'}</span>
          </div>
          <div class="card-comment">${r.comment || ''}</div>
          <div class="card-actions">
            <button class="btn-approve" onclick="updateStatus(${r.rowNum}, '승인')">✓ 승인</button>
            <button class="btn-reject"  onclick="updateStatus(${r.rowNum}, '거절')">✕ 거절</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── 승인/거절 처리 ──────────────
  async function updateStatus(rowNum, status) {
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode:   'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateStatus', rowNum, status })
      });

      // 로컬 데이터 업데이트
      const report = allReports.find(r => r.rowNum === rowNum);
      if (report) report.approved = status;

      updateBadges();
      renderCards();

    } catch(e) {
      alert('처리 중 오류가 발생했습니다.');
    }
  }
</script>
</body>
</html>
